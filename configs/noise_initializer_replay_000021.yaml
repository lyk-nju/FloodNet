exp_name: noise_initializer_replay_000021_cap0
seed: 1234
device: cuda:0

ldf_config: configs/ldf_test.yaml
ckpt: outputs/step_405000.ckpt
vae_ckpt: null
use_ema: true

meta_path: /data1/yuankai/text2Motion/FloodDiffusion/raw_data/HumanML3D/test_000021_codex.txt
sample_name: "000021"
caption_index: 0
max_frames: 0

cfg_text: 1.25
cfg_traj: 3.0
history_length: 30
history_tokens: 30
traj_horizon_tokens: 20
token_dt: 0.20
frames_per_token: 4
num_denoise_steps: null

frontier_tokens: 5
beta_threshold: 0.999
require_zero_update_count: true
training_mode: two_stage_snapshot_replay
optimize_every_tokens: 5
loss_horizon_tokens: 10
train_steps_per_commit: 1
max_commits: 46
log_every_train_steps: 50
terminal_hold_frames: 0
alpha: 1.0
max_delta_norm_ratio: 0.3

replay:
  # Keep the usual 1234-1238 evaluation seeds held out from this pilot.
  train_seeds: [2234, 2235, 2236]
  stage1_steps: 1000
  stage2_steps: 500
  late_progress_start: 0.55
  late_weight_multiplier: 3.0
  initializer_probability: 0.3
  min_valid_affected_frames: 4
  sampler_seed: 1234

model:
  reuse_ldf_traj_encoder: true
  params:
    latent_dim: 4
    text_dim: 4096
    frontier_tokens: 5
    hidden_dim: 256
    traj_emb_dim: 128
    freeze_traj_encoder: true
    zero_init_output: true

text_encoder:
  type: precomputed_t5_pool
  precomputed_text_emb_path: ${dirs.raw_data}/HumanML3D/t5_text_embeddings.pt
  pooling: mean

optimizer:
  lr: 0.0003
  weight_decay: 0.0

rollout:
  alpha: 1.0
  loss_horizon_tokens: 10
  max_delta_norm_ratio: 0.3

loss:
  lambda_vel: 0.05
  lambda_delta: 0.0
  lambda_delta_ratio: 0.01
  anchor_mode: absolute

out_dir: eval/out_eval/noise_initializer_replay/ckpt_405000/sample_000021/cap0
