exp_name: root_refiner_heading_mixed_replay_600k_to_650k
seed: 1234
debug: false
train: true
deterministic: false
save_dir: /data1/yuankai/text2Motion/FloodDiffusion/outputs
resume_ckpt:
init_ckpt: /data1/yuankai/text2Motion/FloodDiffusion/outputs/20260703_171118_root_refiner_heading_hard_decoder_finetune_550k_to_600k/refiner_step_600000.ckpt

logger:
  wandb:
    wandb_key: "${wandb_info.key}"
    project: "${refiner_wandb_info.project}"
    entity: "${wandb_info.entity}"
    train_exclude_log_keys: []

trainer:
  max_steps: 50000
  accelerator: auto
  devices: [4]
  log_every_n_steps: 50
  precision: bf16-mixed
  gradient_clip_val: 1.0

checkpoint:
  step_offset: 600000

validation:
  validation_steps: 1000
  save_every_n_steps: 1000
  save_top_k: -1
  save_last: true
  eval_modes: [groundtruth_duration, pred_duration]
  log_keys:
    - loss
    - pace
    - frame_pace
    - frame_pace_mae
    - frame_pace_acc_pm1
    - frame_pace_acc_pm4
    - xyz_ADE_m
    - xyz_FDE_m
    - heading
    - heading_flip
    - fwd_delta
    - yaw_delta
    - yaw_jump

  suites:
    - name: full_dense_max
      mode_policy: full
      full_plan_ratio: 1.0
      horizon_policy: max
      path_condition_policy: dense_path
      offset_start_enabled: false
      offset_start_prob: 0.0

    - name: sliding_dense_random
      mode_policy: sliding
      full_plan_ratio: 0.0
      horizon_policy: random
      path_condition_policy: dense_path
      offset_start_enabled: false
      offset_start_prob: 0.0

    - name: sliding_dense_max
      mode_policy: sliding
      full_plan_ratio: 0.0
      horizon_policy: max
      path_condition_policy: dense_path
      offset_start_enabled: false
      offset_start_prob: 0.0

model:
  target: models.root_refiner.RootRefiner
  ema_decay:
  params:
    d_model: 512
    n_layers: 6
    n_layers_cond: 3
    n_layers_root: 3
    n_heads: 8
    ff_dim: 1024
    dropout: 0.1

    max_frames: 193
    min_frames: 13

    n_path: 64
    n_hist: 20
    text_emb_dim: 4096
    path_features_dim: 5

    decoder_width: 512
    decoder_depth: 4
    decoder_dilation_growth_rate: 2
    decoder_dropout: 0.1

    pace_text_dim: 32

freeze:
  refiner_modules:
    - duration_head
    - condition_encoder

optimizer:
  target: AdamW
  params:
    lr: 5.0e-6
    weight_decay: 0.01

lr_scheduler:
  target: diffusers.optimization.get_cosine_schedule_with_warmup
  interval: step
  frequency: 1
  params:
    num_warmup_steps: 1000
    num_training_steps: ${trainer.max_steps}

loss_weights:
  pace: 0.0
  frame_pace: 0.0

  xyz: 2.0
  heading: 3.0
  heading_flip: 2.0
  fwd_delta: 0.0
  yaw_delta: 0.5
  yaw_jump: 0.5
  path_control: 0.0
  smoothness: 0.0

text_encoder:
  type: precomputed_t5_pool
  precomputed_text_emb_path: ${data.raw_data_dir}/HumanML3D/t5_text_embeddings.pt
  pooling: mean
  share_with: ldf
  freeze: true
  debug_stub: false

data:
  target: datasets.humanml3d.HumanML3DDataset
  collate_fn: utils.training.root_refiner.collate_fn
  train_bs: 64
  val_bs: 128
  test_bs: 128
  num_workers: 4

  raw_data_dir: ${dirs.raw_data}
  dataset: humanml3d
  train_split_file: train_heading_mixed_replay_600k.txt
  val_split_file: val.txt
  feature_path: new_joint_vecs
  text_path: texts

sampling:
  full_plan_ratio: 0.7
  horizon_policy: random

  path_condition:
    policy: mixed
    ratios:
      dense_path: 0.5
      sparse_path: 0.3
      goal_point: 0.2

    offset_start:
      enabled: true
      prob: 0.25
      max_frames: 20
      apply_to: [dense_path, sparse_path]

    sparse_path:
      point_range: [8, 40]

training_schedule:
  enabled: true
  phases:
    - name: mixed_replay_random
      steps: 25000
      sampling:
        full_plan_ratio: 0.7
        horizon_policy: random
        path_condition:
          policy: mixed
          ratios:
            dense_path: 0.5
            sparse_path: 0.3
            goal_point: 0.2
          offset_start:
            enabled: true
            prob: 0.25
            max_frames: 20
            apply_to: [dense_path, sparse_path]
          sparse_path:
            point_range: [8, 40]

    - name: mixed_replay_hard_horizon
      steps: 25000
      sampling:
        full_plan_ratio: 0.8
        horizon_policy: max
        path_condition:
          policy: mixed
          ratios:
            dense_path: 0.45
            sparse_path: 0.3
            goal_point: 0.25
          offset_start:
            enabled: true
            prob: 0.3
            max_frames: 20
            apply_to: [dense_path, sparse_path]
          sparse_path:
            point_range: [10, 50]
